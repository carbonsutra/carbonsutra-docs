  /api/v1/cluster_data:
    get:
      tags:
        - Emission Clusters
      summary: Retrieve emission cluster data
      operationId: cluster_data
      security:
        - bearerAuth: []
      parameters:
        - name: cluster_name
          in: query
          required: true
          description: Self-defined cluster name.
          schema:
            type: string
          example: Acme-Q2-Travel
      responses:
        "200":
          description: Emission records belonging to the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Returns emission calculations associated with a developer-defined cluster name. Authentication is required.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
      description: CarbonSutra API key supplied as a Bearer token in the Authorization header.
  parameters:
    IataAirportFrom:
      name: iata_airport_from
      in: query
      required: true
      description: Three-letter IATA code of the departure airport.
      schema:
        type: string
        minLength: 3
        maxLength: 3
        pattern: ^[A-Za-z]{3}$
      example: DXB
    IataAirportTo:
      name: iata_airport_to
      in: query
      required: true
      description: Three-letter IATA code of the arrival airport.
      schema:
        type: string
        minLength: 3
        maxLength: 3
        pattern: ^[A-Za-z]{3}$
      example: LAX
    IataAirportCode:
      name: iata_airport_code
      in: query
      required: true
      description: Three-letter IATA airport code used as the reference airport.
      schema:
        type: string
        minLength: 3
        maxLength: 3
        pattern: ^[A-Za-z]{3}$
      example: DXB
    RoundTrip:
      name: round_trip
      in: query
      description: "Set to `Y` for a round trip and `N` for a one-way trip. Default: `Y`."
      schema:
        type: string
        enum:
          - Y
          - N
        default: Y
      example: Y
    AddRf:
      name: add_rf
      in: query
      description: "Controls inclusion of the radiative-forcing multiplier. Default: `Y`."
      schema:
        type: string
        enum:
          - Y
          - N
        default: Y
      example: Y
    IncludeWtt:
      name: include_wtt
      in: query
      description: "Controls inclusion of Well-to-Tank (WTT) emissions. Default: `Y`."
      schema:
        type: string
        enum:
          - Y
          - N
        default: Y
      example: Y
    ClusterName:
      name: cluster_name
      in: query
      description: Optional developer-defined label used to associate the calculation with an emission cluster.
      schema:
        type: string
        minLength: 1
      example: Acme-Q2-Travel
  schemas:
    EmissionMetrics:
      type: object
      description: CO₂e result returned by an emission calculator.
      properties:
        type:
          type: string
          description: CarbonSutra calculation type.
        co2e_gm:
          type: number
          format: double
          description: Estimated emissions in grams of CO₂e.
          example: 83540
        co2e_kg:
          type: number
          format: double
          description: Estimated emissions in kilograms of CO₂e.
          example: 83.54
        co2e_mt:
          type: number
          format: double
          description: Estimated emissions in metric tonnes of CO₂e.
          example: 0.08
        co2e_lb:
          type: number
          format: double
          description: Estimated emissions in pounds of CO₂e.
          example: 184.17
        explanation:
          type: string
          description: Human-readable calculation explanation when provided.
      required:
        - type
      additionalProperties: true
    EmissionResponse:
      type: object
      description: Standard CarbonSutra emission-calculation response.
      properties:
        data:
          $ref: "#/components/schemas/EmissionMetrics"
        success:
          type: boolean
          description: Whether the request completed successfully.
        status:
          type: integer
          format: int32
          description: API status value.
      required:
        - data
        - success
        - status
    GenericJsonResponse:
      type: object
      description: Generic JSON response because the supplied collection does not define the exact response fields.
      additionalProperties: true
    ApiKeyResponse:
      type: object
      description: API-key registration or retrieval response.
      properties:
        data:
          type: object
          properties:
            email:
              type: string
              format: email
            CarbonSutra_API_KEY:
              type: string
              description: Secret CarbonSutra API key. Store securely.
              writeOnly: true
          additionalProperties: true
        CarbonSutra_API_KEY:
          type: string
          description: Secret CarbonSutra API key. Store securely.
          writeOnly: true
        success:
          type: boolean
        status:
          type: integer
          format: int32
      additionalProperties: true
    ClusterRecord:
      type: object
      description: A calculation stored under an emission cluster.
      properties:
        id:
          type: string
          description: Unique record identifier.
        type:
          type: string
          description: Calculation type.
        cluster_name:
          type: string
          description: Developer-defined cluster name.
        attributes:
          type: object
          description: Calculation-specific attributes.
          additionalProperties: true
        estimated_at:
          type: string
          description: Estimate timestamp.
      additionalProperties: true
    ClusterDataResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClusterRecord"
        success:
          type: boolean
        status:
          type: integer
          format: int32
      required:
        - data
        - success
        - status
    ErrorResponse:
      type: object
      description: Generic API error payload.
      properties:
        message:
          type: string
          description: Human-readable error message.
        success:
          type: boolean
        status:
          type: integer
          format: int32
      additionalProperties: true
  responses:
    BadRequest:
      description: The request parameters are invalid or incomplete.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or the supplied Bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The API rate limit has been exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  examples:
    HotelEstimate:
      summary: Example hotel calculation
      value:
        data:
          type: estimate-hotel-stay
          country: Japan
          city_name: ""
          hotel_rating: "4"
          number_of_nights: "2"
          number_of_rooms: "1"
          co2e_gm: 83540
          co2e_kg: 83.54
          co2e_mt: 0.08
          co2e_lb: 184.17
          explanation: CarbonSutra calculation explanation.
        success: true
        status: 200
    Error:
      summary: Generic API error
      value:
        message: Invalid request.
        success: false
        status: 400
externalDocs:
  description: CarbonSutra website
  url: https://www.carbonsutra.com
