        Registers an organization and creates a CarbonSutra API key. The returned key is a secret credential and
        should be stored securely.
  /api/v1/retrieve_key:
    post:
      tags:
        - Emission Clusters
      summary: Retrieve an existing API key
      operationId: retrieve_key
      security: []
      parameters:
        - name: email
          in: query
          required: true
          description: Registered email address.
          schema:
            type: string
            format: email
          example: developer@example.com
        - name: password
          in: query
          required: true
          description: Passphrase used when the key was created.
          schema:
            type: string
            format: password
            minLength: 1
      responses:
