  /api/v1/register_key:
    post:
      tags:
        - Emission Clusters
      summary: Register Key
      operationId: register_key
      security: []
      responses:
        "200":
          description: API key registration result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
      description:
        Registration enables you to get the key and use the function to cluster emissions, using self-defined labels.
        Register with your email address and a password to get a unique key, which can be used as Bearer Token in emission
        calculations along with cluster-name.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - company_name
              properties:
                email:
                  type: string
                  example: janice22@contactous.com
                password:
                  type: string
                  example: A Quick Brown Fox
                company_name:
                  type: string
                  example: Kruger-Brent Inc.
  /api/v1/retrieve_key:
    post:
      tags:
        - Emission Clusters
      summary: Retrieve Key
      operationId: retrieve_key
      security: []
      responses:
        "200":
          description: Existing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
      description: This retrieves an already registered key.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: janice22@contactous.com
                password:
                  type: string
                  example: A Quick Brown Fox
  /api/v1/cluster_data:
    get:
      tags:
        - Emission Clusters
      summary: Cluster Data
      operationId: cluster_data
      security:
        - bearerAuth: []
      parameters:
        - name: cluster_name
          in: query
          required: true
          description: Self-Defined Name of Cluster
          schema:
            type: string
          example: Acme-Q2-Travel
      responses:
        "200":
          description: Emission records belonging to the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
      description:
        "Emissions can be grouped into self-defined clusters and retrieved using those labels. This eliminates
        the need to store the results at developer's end. A key will need to be generated, which is then passed as a Bearer
        Token (within Authorization) in all calculations, so that the user can be identified and the results are securely
        delivered.


        Use the POST API of RegisterKey to obtain your API_KEY which will be used in all estimation calculations for which
        clustering is required. Your email address and a secret phrase (password) will be required to generate this key.


        The POST API of RetrieveKey will give you the key again if it was misplaced, as long as the correct password is entered.


        Note that if clustering is not needed then you do not need API_KEY.


        The GET API of ClusterData returns all the estimations that were calculated for a specific cluster_name."
  /api/v1/sefr_estimation:
    post:
      tags:
        - Special APIs
      summary: Singapore Emission Factors Registry Estimation
      operationId: calculate_emissions_using_singapore_emission_factors_registry
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - category
                - activity
                - value
              properties:
                category:
                  type: string
                  example: Land Transport
                activity:
                  type: string
                  example: Hybrid Car
                value:
                  type: number
                  format: double
                  example: 8
      responses:
        "200":
          description: Estimated emissions using Singapore Emission Factors Registry factors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
      description: "# Singapore Emission Factors Registry Estimation


        Calculates estimated greenhouse gas emissions using the Singapore Emission Factors Registry based on the supplied
        category, activity and value."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
      description: CarbonSutra API key supplied as a Bearer token in the Authorization header.
  parameters:
    IataAirportFrom:
      name: iata_airport_from
      in: query
      required: true
      description:
        "The departing airport's IATA airport code (The unique 3 digit geocode, also known as IATA location identifier,
        IATA station code, or location identifier) "
      schema:
        type: string
        minLength: 3
        maxLength: 3
        pattern: ^[A-Za-z]{3}$
      example: " "
    IataAirportTo:
      name: iata_airport_to
      in: query
      required: true
      description:
        "The arrival airport's IATA airport code (The unique 3 digit geocode, also known as IATA location identifier,
        IATA station code, or location identifier) "
      schema:
        type: string
        minLength: 3
        maxLength: 3
        pattern: ^[A-Za-z]{3}$
      example: " "
    IataAirportCode:
      name: iata_airport_code
      in: query
      required: true
      description:
        An IATA airport code is unique 3 digit geocode (also known as IATA location identifier, IATA station code,
        or location identifier)
      schema:
        type: string
        minLength: 3
        maxLength: 3
        pattern: ^[A-Za-z]{3}$
      example: DXB
    RoundTrip:
      name: round_trip
      in: query
      description:
        The default value of "Y" means that the traveller has taken the flight from origin to destination and then
        back to the same origin in the same class, while a "N" means a one-way journey.
      schema:
        type: string
        enum:
          - Y
          - N
        default: Y
      example: " "
    AddRf:
      name: add_rf
      in: query
      description:
        The default value of "Y" adds the radiative forcing multiplier factor in the footprint calculation; "N"
        bypasses it
      schema:
        type: string
        enum:
          - Y
          - N
        default: Y
      example: " "
    IncludeWtt:
      name: include_wtt
      in: query
      description: The default value of "Y" includes the Well-to-Tank (WTT) factors while "N" bypasses it
      schema:
        type: string
        enum:
          - Y
          - N
        default: Y
      example: " "
    ClusterName:
      name: cluster_name
      in: query
      description: Identifier to log and aggregate results under the Cluster Data API
      schema:
        type: string
        minLength: 1
      example: Acme-Q2-Travel
  schemas:
    EmissionMetrics:
      type: object
      description: CO₂e result returned by an emission calculator.
      properties:
        type:
          type: string
          description: CarbonSutra calculation type.
        co2e_gm:
          type: number
          format: double
          description: Estimated emissions in grams of CO₂e.
          example: 83540
        co2e_kg:
          type: number
          format: double
          description: Estimated emissions in kilograms of CO₂e.
          example: 83.54
        co2e_mt:
          type: number
          format: double
          description: Estimated emissions in metric tonnes of CO₂e.
          example: 0.08
        co2e_lb:
          type: number
          format: double
          description: Estimated emissions in pounds of CO₂e.
          example: 184.17
        explanation:
          type: string
          description: Human-readable calculation explanation when provided.
      required:
        - type
      additionalProperties: true
    EmissionResponse:
      type: object
      description: Standard CarbonSutra emission-calculation response.
      properties:
        data:
          $ref: "#/components/schemas/EmissionMetrics"
        success:
          type: boolean
          description: Whether the request completed successfully.
        status:
          type: integer
          format: int32
          description: API status value.
      required:
        - data
        - success
        - status
    GenericJsonResponse:
      type: object
      description: Generic JSON response because the supplied collection does not define the exact response fields.
      additionalProperties: true
    ApiKeyResponse:
      type: object
      description: API-key registration or retrieval response.
      properties:
        data:
          type: object
          properties:
            email:
              type: string
              format: email
            CarbonSutra_API_KEY:
              type: string
              description: Secret CarbonSutra API key. Store securely.
              writeOnly: true
          additionalProperties: true
        CarbonSutra_API_KEY:
          type: string
          description: Secret CarbonSutra API key. Store securely.
          writeOnly: true
        success:
          type: boolean
        status:
          type: integer
          format: int32
      additionalProperties: true
    ClusterRecord:
      type: object
      description: A calculation stored under an emission cluster.
      properties:
        id:
          type: string
          description: Unique record identifier.
        type:
          type: string
          description: Calculation type.
        cluster_name:
          type: string
          description: Developer-defined cluster name.
        attributes:
          type: object
          description: Calculation-specific attributes.
          additionalProperties: true
        estimated_at:
          type: string
          description: Estimate timestamp.
      additionalProperties: true
    ClusterDataResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClusterRecord"
        success:
          type: boolean
        status:
          type: integer
          format: int32
      required:
        - data
        - success
        - status
    ErrorResponse:
      type: object
      description: Generic API error payload.
      properties:
        message:
          type: string
          description: Human-readable error message.
        success:
          type: boolean
        status:
          type: integer
          format: int32
      additionalProperties: true
  responses:
    BadRequest:
      description: The request parameters are invalid or incomplete.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or the supplied Bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The API rate limit has been exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  examples:
    HotelEstimate:
      summary: Example hotel calculation
      value:
        data:
          type: estimate-hotel-stay
          country: Japan
          city_name: ""
          hotel_rating: "4"
          number_of_nights: "2"
          number_of_rooms: "1"
          co2e_gm: 83540
          co2e_kg: 83.54
          co2e_mt: 0.08
          co2e_lb: 184.17
          explanation: CarbonSutra calculation explanation.
        success: true
        status: 200
    Error:
      summary: Generic API error
      value:
        message: Invalid request.
        success: false
        status: 400
externalDocs:
  description: CarbonSutra website
  url: https://www.carbonsutra.com
