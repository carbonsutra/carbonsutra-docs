  /api/v1/nearest-airport-from-another-airport:
    get:
      tags:
        - Airports
      summary: Airport to Nearest Airport
      operationId: find_nearest_airport_from_another_airport
      security: []
      parameters:
        - $ref: "#/components/parameters/IataAirportCode"
        - name: same_country
          in: query
          description:
            A value of "Y" will result in closest airport with the same country of IATA Code, else the country borders
            will be ignored and the nearest airport will be found.
          schema:
            type: string
            enum:
              - Y
              - N
          example: Y
      responses:
        "200":
          description: Nearest airport and distance in kilometres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
      description: "# Airport to Nearest Airport


        Returns the distance in kilometers of the closest airport from a given airport code, along with name and IATA code,
        using Haversine function.


        operationId: find_nearest_airport_from_another_airport"
      externalDocs:
        description: CarbonSutra methodology and API reference
        url: https://www.carbonsutra.com/api-carbon-emission-supplementary-api
  /api/v1/nearest-airport:
    get:
      tags:
        - Airports
      summary: Postal Code to Nearest Airport
      operationId: find_nearest_airport_from_postal_code
      security: []
      parameters:
        - name: country_code
          in: query
          required: true
          description: Two digit ISO 3166-1 alpha-2 country code.
          schema:
            type: string
            minLength: 2
            maxLength: 2
          example: IN
        - name: postal_code
          in: query
          required: true
          description: A valid postal code of a location
          schema:
            type: string
          example: "604407"
      responses:
        "200":
          description: Nearest airport information and distance in kilometres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
      description: "# Postal Code to Nearest Airport


        Returns the distance in kilometers bewteen a postal code and the nearlest airport to it, using Haversine function.


        This is an advanced algorithm which takes a postal code and country code as input and returns the nearest airport
        its latitude/longitude value. The distance between the coordinates of postal code and its airport is measured using
        Haversine function and the returned value is in kilometers. The data has instances of multiple addresses with different
        values of latitude/longitude associated with the same postal code. For such cases, an array of all addresses and their
        distance with nearest airport for the same postal code is returned. The source of 1.5 million postal code data is
        taken as it is from [https://public.opendatasoft.com/explore/dataset/geonames-postal-code/](https://public.opendatasoft.com/explore/dataset/geonames-postal-code/).
        For airports, the publicly available database of IATA codes and airport names is used.


        operationId: find_nearest_airport_from_postal_code


        ## Reference


        - [https://public.opendatasoft.com/explore/dataset/geonames-postal-code/](https://public.opendatasoft.com/explore/dataset/geonames-postal-code/)"
      externalDocs:
        description: CarbonSutra methodology and API reference
        url: https://www.carbonsutra.com/api-carbon-emission-supplementary-api
